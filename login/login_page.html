<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="login_page.css">
</head>
<body class="bg-light-yellow">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px; background-color: #fff; border-radius: 10px;">
      <div class="text-center mb-3">
        <h3 class="text-yellow">Welcome</h3>
        <p class="text-muted">Login or Signup to continue</p>
      </div>
      <div id="form-container">
        <!-- Login Form -->
        <form id="login-form" method="post" action="/HeyListener/login">
          <div class="mb-3">
            <label for="login-email" class="form-label text-yellow">Email</label>
            <input type="email" name="email" class="form-control" id="login-email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="login-password" class="form-label text-yellow">Password</label>
            <input type="password" name="password" class="form-control" id="login-password" placeholder="Enter your password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary" style="background-color: #FFD7EF; border: none; color: black;">Login</button>
          </div>
          <div class="text-center mt-3">
            <p class="small">Don't have an account? <a href="#" id="show-signup" class="text-yellow">Signup</a></p>
          </div>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="d-none"  method="post" action="/HeyListener/signup">
          <div class="mb-3">
            <label for="signup-name" class="form-label text-yellow"> First Name</label>
            <input type="text" name="fName" class="form-control" id="signup-name" placeholder="Enter your first name" required>
          </div>
          <div class="mb-3">
            <label for="signup-name" class="form-label text-yellow"> Last Name</label>
            <input type="text" name="lName" class="form-control" id="signup-name" placeholder="Enter your last name" required>
          </div>
          <div class="mb-3">
            <label for="signup-mobileno" class="form-label text-yellow">Mobile Number</label>
            <input type="text" name="mobile" class="form-control" id="signup-mobileno" placeholder="Enter your mobile number" required>
          </div>
          <div class="mb-3">
            <label for="signup-email" class="form-label text-yellow">Email</label>
            <input type="email" name="email" class="form-control" id="signup-email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="signup-password" class="form-label text-yellow">Password</label>
            <input type="password" name="pass1" class="form-control" id="signup-password" placeholder="Create a password" required>
          </div>
          <div class="mb-3">
            <label for="signup-password" class="form-label text-yellow">Conform Password</label>
            <input type="password" name="pass2" class="form-control" id="signup-password" placeholder="Create a password" required>
          </div>
          <div class="d-grid">
            <button type="submit"  class="btn btn-primary" style="background-color: #FFD7EF; border: none; color: black;">Signup</button>
          </div>
          <div class="text-center mt-3">
            <p class="small">Already have an account? <a href="#" id="show-login" class="text-yellow">Login</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="login_page.js"></script>
</body>
</html>
